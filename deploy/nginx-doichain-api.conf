# Doichain REST API auf doi-btc-node. Uebergang: selbstsigniertes Zertifikat, bis ein
# Hostname (api.doi.zone) auf 136.243.155.62 zeigt und certbot ein echtes Zertifikat holt.
# Hinweis: install.sh ueberschreibt diese Datei nur, solange sie keine Zeilen von certbot enthaelt.
limit_req_zone $binary_remote_addr zone=doiapi:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=doiapi_upload:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=doimcp:10m rate=5r/s;
# Browser (GET mit text/html) bekommen unter /mcp die Landingpage, MCP-Clients den Server.
map "$request_method:$http_accept" $mcp_browser {
    default 0;
    "~^GET:.*text/html" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.doi.zone doi-api.sendlabs.de 136.243.155.62;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name api.doi.zone doi-api.sendlabs.de 136.243.155.62;
    server_tokens off;

    ssl_certificate     /etc/ssl/doichain-api/selfsigned.crt;
    ssl_certificate_key /etc/ssl/doichain-api/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Kleine JSON-Anfragen als Regel, groessere Grenzen nur auf den Endpunkten, die sie brauchen.
    client_max_body_size 64k;
    access_log /var/log/nginx/doichain-api.access.log;
    error_log  /var/log/nginx/doichain-api.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Fehler, die nginx selbst erzeugt, im Fehlerformat der API ausliefern.
    error_page 413 = @e413;
    error_page 429 = @e429;
    error_page 502 = @e502;
    error_page 504 = @e504;
    location @e413 { default_type application/json; return 413 '{"error":{"type":"http","code":413,"message":"Anfrage zu gross. JSON-Anfragen hoechstens 64 KB, Rohtransaktionen (/v1/tx/send, /v1/tx/decode, /v1/rpc) hoechstens 1 MB, Datei-Uploads hoechstens 50 MB"}}'; }
    location @e429 { default_type application/json; return 429 '{"error":{"type":"http","code":429,"message":"Zu viele Anfragen, bitte langsamer (10 je Sekunde, Uploads 1 je Sekunde)"}}'; }
    location @e502 { default_type application/json; return 502 '{"error":{"type":"http","code":502,"message":"API-Dienst antwortet nicht (doichain-api.service pruefen)"}}'; }
    location @e504 { default_type application/json; return 504 '{"error":{"type":"http","code":504,"message":"Zeitueberschreitung zwischen nginx und API"}}'; }

    # Landingpage der API (web/api-site) unter / und die Verifile-App (web/verifile) unter /poe/.
    location = / {
        root /var/www/doichain-api-site;
        try_files /index.html =404;
    }
    location = /poe { return 301 /poe/; }
    location = /poe/config.js {
        alias /var/www/verifile/config.js;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /poe/ {
        alias /var/www/verifile/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://doi-api.sendlabs.de https://api.doi.zone; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # MCP-Server (doichain-mcp.service auf 127.0.0.1:8081), zustandslos mit JSON-Antworten. Einen
    # SSE-Strom per GET gibt es in diesem Betrieb nicht, deshalb 405 wie in der Spezifikation vorgesehen.
    location = /mcp {
        if ($mcp_browser) { rewrite ^ /mcp-site/index.html last; }
        if ($request_method ~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 256k;
        limit_req zone=doimcp burst=20 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8081;
    }
    location = /mcp/ { return 308 /mcp; }
    location = /mcp/health { proxy_pass http://127.0.0.1:8081/health; }
    location /mcp-site/ {
        alias /var/www/doichain-mcp-site/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    # Datei-Uploads (PoE), auch mit Schraegstrich am Ende.
    location ~ ^/v1/poe/(file|verify/file)/?$ {
        client_max_body_size 52m;
        limit_req zone=doiapi_upload burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    # Rohtransaktionen bis 100 kvB sind als Hex rund 200 KB gross, dazu der RPC-Durchgriff.
    location ~ ^/v1/(tx/(send|decode)|rpc)/?$ {
        client_max_body_size 1m;
        limit_req zone=doiapi burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=doiapi burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
}
