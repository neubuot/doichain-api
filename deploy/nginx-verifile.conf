# Verifile, die PoE-Web-App (statische Dateien aus web/verifile). Vor der DNS-Umstellung nur Port 80
# mit ACME-Pfad. Sobald die Domain auf den Server zeigt:
#   certbot --nginx -d verifile.it -d www.verifile.it --redirect -m <mail> --agree-tos -n
# certbot ergaenzt den 443-Block, install.sh laesst die Datei danach unveraendert (Markierung "managed by Certbot").
# Aenderungen an dieser Vorlage dann von Hand in /etc/nginx/sites-available/verifile uebernehmen.
# 'wasm-unsafe-eval' ist noetig, weil hash-wasm sein WebAssembly-Modul zur Laufzeit kompiliert.
#
# Entwickler-Eingang seit API 1.9.0:
#   /developers/  Anleitung (statisch, web/verifile/developers)
#   /api/         Verifile API: nur die Nachweis-Aufrufe der Doichain API (doichain-api.service, 127.0.0.1:8080).
#                 Die Liste der Pfade muss zu VERIFILE_API_OPERATIONS in doichain_api/main.py passen
#                 (tests/test_poe.py prueft das). Keine Datei-Uploads: Bei Verifile bleibt die Datei beim Nutzer.
#   /mcp          Verifile MCP-Server (verifile-mcp.service, 127.0.0.1:8083, nur die vier Nachweis-Werkzeuge)
limit_req_zone $binary_remote_addr zone=verifile_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=verifile_mcp:10m rate=10r/s;
# Browser (GET mit text/html) leitet /mcp auf die Anleitung, MCP-Clients bekommen den Server.
map "$request_method:$http_accept" $verifile_mcp_browser {
    default 0;
    "~^GET:.*text/html" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name verifile.it www.verifile.it verifile.app www.verifile.app;
    server_tokens off;

    if ($host = www.verifile.it) { return 301 https://verifile.it$request_uri; }
    root /var/www/verifile;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://doi-api.sendlabs.de https://api.doi.zone; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Fuer die durchgereichten Aufrufe. X-Forwarded-For wird ueberschrieben statt ergaenzt, damit das
    # Tageskontingent immer an der echten Adresse des Aufrufers haengt.
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location / {
        try_files $uri $uri/ =404;
    }
    # config.js traegt den poe-Schluessel, nach einer Rotation sofort neu laden.
    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /llms.txt {
        charset utf-8;
    }

    # Verifile API. Fehler, die nginx selbst erzeugt, kommen im Fehlerformat der API.
    location = /api  { return 302 /developers/; }
    location = /api/ { return 302 /developers/; }
    location = /api/openapi.json {
        error_page 429 = @api429;
        error_page 502 = @api502;
        error_page 504 = @api504;
        limit_req zone=verifile_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080/verifile/openapi.json;
    }
    location ~ "^/api/v1/(status|poe|poe/quota|poe/verify|poe/public|poe/public/quota|poe/[0-9A-Fa-f]{64})$" {
        error_page 413 = @api413;
        error_page 429 = @api429;
        error_page 502 = @api502;
        error_page 504 = @api504;
        limit_req zone=verifile_api burst=30 nodelay;
        limit_req_status 429;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"type":"http","code":404,"message":"Diesen Aufruf gibt es in der Verifile API nicht. Erlaubt sind die Nachweis-Aufrufe unter /api/v1/poe und /api/v1/status, siehe https://verifile.it/developers/"}}';
    }
    location @api413 { default_type application/json; return 413 '{"error":{"type":"http","code":413,"message":"Anfrage zu gross, JSON-Anfragen hoechstens 64 KB"}}'; }
    location @api429 { default_type application/json; return 429 '{"error":{"type":"http","code":429,"message":"Zu viele Anfragen, bitte langsamer (10 je Sekunde)"}}'; }
    location @api502 { default_type application/json; return 502 '{"error":{"type":"http","code":502,"message":"API-Dienst antwortet nicht"}}'; }
    location @api504 { default_type application/json; return 504 '{"error":{"type":"http","code":504,"message":"Zeitueberschreitung zwischen nginx und API"}}'; }

    # Verifile MCP-Server, zustandslos mit JSON-Antworten. Einen SSE-Strom per GET gibt es nicht, deshalb 405.
    location = /mcp {
        if ($verifile_mcp_browser) { return 302 "/developers/#mcp"; }
        error_page 405 = @mcp405;
        error_page 413 = @mcp413;
        error_page 429 = @mcp429;
        if ($request_method ~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 256k;
        limit_req zone=verifile_mcp burst=40 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8083;
    }
    location @mcp405 {
        default_type application/json;
        add_header Allow "POST" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 405 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Method not allowed. MCP clients send POST requests to this address, browsers are redirected to https://verifile.it/developers/"}}';
    }
    location @mcp413 {
        default_type application/json;
        return 413 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Request too large, at most 256 KB per MCP request"}}';
    }
    location @mcp429 {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Rate limit reached, at most 10 requests per second per IP address. Please retry shortly"}}';
    }
    location = /mcp/ { return 308 /mcp; }
    location = /mcp/health {
        limit_req zone=verifile_mcp burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8083/health;
    }

    location ~* \.(css|js|svg|png|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
}
