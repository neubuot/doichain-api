# Verifile, die PoE-Web-App (statische Dateien aus web/verifile). Vor der DNS-Umstellung nur Port 80
# mit ACME-Pfad. Sobald die Domain auf den Server zeigt:
#   certbot --nginx -d verifile.it -d www.verifile.it --redirect -m <mail> --agree-tos -n
# certbot ergaenzt den 443-Block, install.sh laesst die Datei danach unveraendert (Markierung "managed by Certbot").
# 'wasm-unsafe-eval' ist noetig, weil hash-wasm sein WebAssembly-Modul zur Laufzeit kompiliert.
server {
    listen 80;
    listen [::]:80;
    server_name verifile.it www.verifile.it verifile.app www.verifile.app;
    server_tokens off;

    if ($host = www.verifile.it) { return 301 https://verifile.it$request_uri; }
    root /var/www/verifile;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://doi-api.sendlabs.de https://api.doi.zone; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
    # config.js traegt den poe-Schluessel, nach einer Rotation sofort neu laden.
    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(css|js|svg|png|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
}
